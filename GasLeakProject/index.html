<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Modern Tahliye Simülasyonu - Şehriban Ümmü İnce</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
        body { margin:0; overflow:hidden; font-family:'Segoe UI', sans-serif; background-color: #000; }
        
        /* Modern UI Panel */
        #ui-panel {
            position: fixed; top: 25px; left: 25px; background: rgba(15, 23, 42, 0.9);
            color: white; padding: 20px; border-radius: 16px; border: 1px solid rgba(46, 204, 113, 0.3);
            z-index: 1000; min-width: 240px; backdrop-filter: blur(8px);
        }
        
        #gas-bar { width: 100%; height: 10px; background: #1e293b; border-radius: 5px; margin: 12px 0; overflow: hidden; }
        #gas-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #2ecc71, #e74c3c); transition: width 0.4s ease-out; }
        
        /* Modern Etkileşim Menüsü */
        #interact-menu {
            position: fixed; display: none; background: #1e293b; color: white;
            border-radius: 12px; padding: 10px; z-index: 2000; min-width: 160px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155;
        }
        
        .menu-btn {
            display: block; width: 100%; background: transparent; color: #f8fafc;
            border: none; padding: 10px 15px; text-align: left; cursor: pointer;
            border-radius: 6px; margin-bottom: 4px; font-weight: bold;
        }
        .menu-btn:hover { background: #334155; color: #2ecc71; }
        
        #danger-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: radial-gradient(circle, rgba(255,0,0,0) 40%, rgba(255,0,0,0.3) 100%); display: none; pointer-events: none; z-index: 500; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="interact-menu">
        <div id="menu-title" style="color: #2ecc71; padding-bottom: 8px; font-weight: bold; text-align: center; border-bottom: 1px solid #334155; margin-bottom: 8px;">Birim</div>
        <button class="menu-btn" onclick="handleMenuAction('open')">✅ Çalıştır / Aç</button>
        <button class="menu-btn" onclick="handleMenuAction('close')">❌ Durdur / Kapat</button>
        <button class="menu-btn" style="border:none; opacity: 0.6;" onclick="closeMenu()">🔙 İptal</button>
    </div>

    <div id="ui-panel">
        <h4 style="margin:0; opacity: 0.7;">GAZ KONSANTRASYONU</h4>
        <h2 style="margin:5px 0;">% <span id="gas-level">0</span></h2> 
        <div id="gas-bar"><div id="gas-fill"></div></div>
        <p id="vent-status" style="color: #f1c40f; font-size: 14px; margin: 0;">Sistem: Hazır</p><p id="feedback-note" style="font-weight: bold; font-size: 15px; margin-top: 10px;"></p>
    </div>

    <div id="danger-overlay"></div> 

    <a-scene shadow="type: pcfsoft" cursor="rayOrigin: mouse">
        <a-sky color="#0f172a"></a-sky>
        <a-entity light="type: ambient; color: #fff; intensity: 0.5"></a-entity>
        <a-entity light="type: point; intensity: 0.7; distance: 12; castShadow: true" position="0 3 0"></a-entity>
        
        <a-entity id="rig" position="0 0 2">
            <a-entity camera look-controls wasd-controls="acceleration: 65" position="0 1.6 0"></a-entity>
        </a-entity>

        <a-plane rotation="-90 0 0" width="16" height="16" color="#2c3e50" material="roughness: 0.8; metalness: 0.1"></a-plane>
        <a-box position="0 4 0" width="16" height="0.1" depth="16" color="#ffffff"></a-box>

        <a-box position="0 2 -8" width="16" height="4" depth="0.1" color="#f1f5f9"></a-box> <a-box position="8 2 0" rotation="0 90 0" width="16" height="4" depth="0.1" color="#f1f5f9"></a-box> <a-box position="-8 2 0" rotation="0 90 0" width="16" height="4" depth="0.1" color="#f1f5f9"></a-box> <a-box position="-4.5 2 8" width="7" height="4" depth="0.1" color="#f1f5f9"></a-box>
        <a-box position="5 2 8" width="9.2" height="4" depth="0.1" color="#f1f5f9"></a-box>
        <a-box position="0 3.6 8" width="2" height="0.8" depth="0.1" color="#f1f5f9"></a-box>

        <a-entity id="door-unit" position="-1 1.1 8" onclick="window.openMenu(event, 'door-unit')">
            <a-box id="door-body" width="1.4" height="2.2" depth="0.05" color="#1e293b" position="0.7 0 0" class="clickable">
                <a-sphere position="1.2 0 0.05" radius="0.03" color="#f1c40f"></a-sphere>
            </a-box>
        </a-entity>

        <a-plane rotation="-90 0 0" width="6" height="8" color="#1e293b" position="2 -0.01 12"></a-plane>
        <a-box position="2 4 12" width="6" height="0.1" depth="8" color="#ffffff"></a-box> 
        <a-box position="2 2 16" width="6" height="4" depth="0.1" color="#cbd5e1"></a-box> 

        <a-entity id="window-area" position="-7.95 2.2 -1.5">
            <a-entity id="custom-landscape" rotation="0 90 0" position="0 0 0">
                <a-plane width="3" height="2" color="#2ecc71" material="shader: flat"></a-plane>
                
                <a-plane width="3" height="0.8" position="0 0.6 0.01" color="#3498db" material="shader: flat"></a-plane>
                
                <a-circle radius="0.3" position="0.8 0.5 0.02" color="#f1c40f" material="shader: flat"></a-circle>
            </a-entity>
            
            <a-box id="window-glass" rotation="0 90 0" width="2.8" height="1.8" depth="0.05" 
                   color="#add8e6" opacity="0.2" position="0.05 0 0" class="clickable"
                   onclick="window.openMenu(event, 'window-unit')"></a-box>
            
            <a-box width="0.02" height="2.4" depth="0.6" position="0.1 0 -1.2" color="#8b0000" material="roughness: 1"></a-box>
            <a-box width="0.02" height="2.4" depth="0.6" position="0.1 0 1.2" color="#8b0000" material="roughness: 1"></a-box>
            <a-box width="0.02" height="0.15" depth="3" position="0.1 1 0" color="#334155"></a-box> </a-entity>
        
        <a-entity id="l-kitchen" position="-4.5 0.55 -7.2">
            <a-box width="6" height="1.1" depth="1.5" color="#ffffff" material="roughness: 0.4"></a-box>
            <a-box width="1.5" height="1.1" depth="4" position="-2.25 0 1.25" color="#ffffff"></a-box>
            <a-box id="stove-unit" class="clickable" width="0.8" height="0.02" depth="0.6" position="0 0.56 0" color="#000" onclick="window.openMenu(event, 'stove-unit')"></a-box>
            <a-box id="aspirator-unit" class="clickable" width="1.2" height="0.1" depth="0.8" position="0 2.2 0" color="#64748b" onclick="window.openMenu(event, 'aspirator-unit')"></a-box>
        </a-entity>

        <a-entity id="modern-bookshelf" position="7.8 0 5">
            <a-box width="0.1" height="3.5" depth="2" color="#1e293b" position="0.05 1.75 0"></a-box>
            
            <a-box width="0.6" height="0.05" depth="2" color="#5d4037" position="-0.3 0.7 0" material="roughness: 1"></a-box>
            <a-box width="0.6" height="0.05" depth="2" color="#5d4037" position="-0.3 1.3 0" material="roughness: 1"></a-box>
            <a-box width="0.6" height="0.05" depth="2" color="#5d4037" position="-0.3 1.9 0" material="roughness: 1"></a-box>
            <a-box width="0.6" height="0.05" depth="2" color="#5d4037" position="-0.3 2.5 0" material="roughness: 1"></a-box>
            <a-box width="0.6" height="0.05" depth="2" color="#5d4037" position="-0.3 3.1 0" material="roughness: 1"></a-box>

            <a-box width="0.1" height="0.35" depth="0.3" color="#e74c3c" position="-0.3 1.5 0.5"></a-box>
            <a-box width="0.1" height="0.4" depth="0.3" color="#3498db" position="-0.3 1.52 0.2"></a-box>
            <a-box width="0.1" height="0.3" depth="0.3" color="#f1c40f" position="-0.3 1.47 -0.3"></a-box>
            <a-box width="0.1" height="0.45" depth="0.3" color="#2ecc71" position="-0.3 2.75 0.1"></a-box>
            <a-box width="0.1" height="0.35" depth="0.3" color="#9b59b6" position="-0.3 2.7 -0.6"></a-box>
        </a-entity>

        <a-entity id="fridge-group" position="-0.5 1.9 -7.1">
            <a-box width="1.5" height="3.8" depth="1.5" color="#bdc3c7" material="metalness: 0.6; roughness: 0.2"></a-box>
            
            <a-box width="1.52" height="1.2" depth="0.05" position="0 1.25 0.76" color="#d1d8e0" material="metalness: 0.7; roughness: 0.1"></a-box>
            <a-box width="1.52" height="2.4" depth="0.05" position="0 -0.6 0.76" color="#d1d8e0" material="metalness: 0.7; roughness: 0.1"></a-box>
            
            <a-box width="1.53" height="0.02" depth="0.06" position="0 0.6 0.77" color="#2f3542"></a-box>

            <a-box width="0.04" height="0.6" depth="0.08" position="0.6 1.25 0.82" color="#2f3542" material="metalness: 0.9"></a-box>
            <a-box width="0.04" height="1.2" depth="0.08" position="0.6 -0.6 0.82" color="#2f3542" material="metalness: 0.9"></a-box>

            <a-box width="0.2" height="0.05" depth="0.01" position="0 1.6 0.79" color="#1e272e" material="metalness: 1"></a-box>
        </a-entity>

        <a-entity id="modern-sofa" position="5.5 0 -2.5" rotation="0 180 0">
            <a-box width="3.8" height="0.5" depth="1.1" color="#475569" position="0 0.3 0" material="roughness: 1; metalness: 0"></a-box>
            <a-box width="1.1" height="0.5" depth="2.0" color="#475569" position="-1.35 0 1.55" material="roughness: 1; metalness: 0"></a-box>
            
            <a-box width="1.8" height="0.6" depth="0.2" color="#475569" position="-0.9 0.7 -0.45" rotation="-10 0 0"></a-box>
            <a-box width="1.8" height="0.6" depth="0.2" color="#475569" position="0.9 0.7 -0.45" rotation="-10 0 0"></a-box>
            <a-box width="0.2" height="0.6" depth="1.8" color="#475569" position="-1.8 0.7 1.55" rotation="0 10 0"></a-box>

            <a-box width="0.25" height="0.55" depth="1.1" color="#334155" position="1.95 0.35 0"></a-box>
        </a-entity>

        <a-entity id="tv-area" position="5 0 -7.5">
            <a-box width="3" height="0.5" depth="0.8" color="#1e293b" position="0 0.25 0"></a-box>
            <a-box width="2.5" height="1.4" depth="0.05" position="0 1.5 0" color="#000000" material="metalness: 0.9"></a-box>
        </a-entity>

        <a-entity id="dining-area" position="-1.5 0 3">
    <a-box width="2.8" height="0.08" depth="1.2" color="#5d4037" position="0 0.9 0" material="roughness: 1; metalness: 0.1"></a-box>
    
    <a-box width="0.08" height="0.9" depth="0.08" color="#222" position="1.3 0.45 0.5"></a-box>
    <a-box width="0.08" height="0.9" depth="0.08" color="#222" position="-1.3 0.45 0.5"></a-box>
    <a-box width="0.08" height="0.9" depth="0.08" color="#222" position="1.3 0.45 -0.5"></a-box>
    <a-box width="0.08" height="0.9" depth="0.08" color="#222" position="-1.3 0.45 -0.5"></a-box>

    <script>
        const chairsX = [-0.9, 0, 0.9];
        chairsX.forEach(x => {
            // Üst ve Alt Sıra (Toplam 6 Sandalye)
            [-0.85, 0.85].forEach(z => {
                const rotation = z > 0 ? 180 : 0;
                document.write(`
                    <a-entity position="${x} 0 ${z}" rotation="0 ${rotation} 0">
                        <a-box width="0.5" height="0.06" depth="0.5" color="#334155" position="0 0.45 0"></a-box>
                        <a-box width="0.5" height="0.7" depth="0.06" color="#334155" position="0 0.7 -0.23"></a-box>
                        
                        <a-cylinder radius="0.02" height="0.45" color="#222" position="0.2 0.22 0.2"></a-cylinder>
                        <a-cylinder radius="0.02" height="0.45" color="#222" position="-0.2 0.22 0.2"></a-cylinder>
                        <a-cylinder radius="0.02" height="0.45" color="#222" position="0.2 0.22 -0.2"></a-cylinder>
                        <a-cylinder radius="0.02" height="0.45" color="#222" position="-0.2 0.22 -0.2"></a-cylinder>
                    </a-entity>
                `);
            });
        });
    </script>
</a-entity>

        <a-entity id="fan-unit" position="-7.95 3.5 -4" onclick="window.openMenu(event, 'fan-unit')">
            <a-cylinder rotation="0 0 90" radius="0.4" height="0.1" color="#1e293b" class="clickable"></a-cylinder>
            <a-box id="fan-blades" width="0.02" height="0.7" depth="0.1" color="#94a3b8"></a-box>
        </a-entity>

        <a-entity id="gas-container"></a-entity> 
    </a-scene>

    <script src="gas_sim.js"></script>
</body>
</html>
